# Render.com deployment configuration
# This file tells Render how to build and run the backend service.
# Docs: https://docs.render.com/blueprint-spec

services:
  # ─── FastAPI Backend ───────────────────────────────────────
  - type: web
    name: kee-crochet-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /
